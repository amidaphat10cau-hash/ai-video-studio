<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Video Studio</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; background: #f5f5f5; color: #222; }
    main { max-width: 650px; margin: auto; padding: 18px; }
    .card { background: white; border-radius: 18px; padding: 18px; margin: 12px 0; box-shadow: 0 2px 12px #0001; }
    h1 { font-size: 25px; margin-top: 4px; }
    label { display: block; font-weight: 700; margin: 14px 0 6px; }
    textarea, input, select, button { width: 100%; box-sizing: border-box; font-size: 16px; border-radius: 12px; padding: 12px; }
    textarea, input, select { border: 1px solid #ccc; background: #fff; }
    button { border: 0; background: #111; color: #fff; font-weight: 700; cursor: pointer; margin-top: 12px; }
    button:disabled { opacity: .5; }
    .tabs { display: flex; gap: 8px; }
    .tabs button { background: #ddd; color: #222; }
    .tabs button.on { background: #111; color: #fff; }
    #status, #voiceStatus { white-space: pre-wrap; margin-top: 10px; font-weight: bold; }
    video { width: 100%; border-radius: 14px; margin-top: 12px; }
    small { color: #666; }
  </style>
</head>
<body>
  <main>
    <div class="card">
      <h1>🎬 AI Video Studio</h1>
      <small>Tạo video AI ngay trên điện thoại.</small>
      
      <div class="tabs">
        <button id="t1" class="on" onclick="mode('image')">🖼️ Ảnh -> Video</button>
        <button id="t2" onclick="mode('text')">✍️ Văn bản -> Video</button>
      </div>

      <label>Ảnh (không bắt buộc ở chế độ văn bản)</label>
      <input id="image" type="file" accept="image/*">

      <label>Mô tả chuyển động / cảnh</label>
      <textarea id="prompt" rows="3" placeholder="Ví dụ: Những đám mây trắng trôi chậm trên bầu trời..."></textarea>

      <!-- Bổ sung ô nhập phụ đề -->
      <label>Phụ đề video (Subtitle)</label>
      <input id="subtitle" type="text" placeholder="Nhập câu phụ đề muốn hiển thị trên video...">

      <label>Tỷ lệ</label>
      <select id="ratio">
        <option value="720:1280">9:16 dọc</option>
        <option value="1280:720">16:9 ngang</option>
      </select>

      <label>Thời lượng</label>
      <select id="duration">
        <option value="5">5 giây</option>
        <option value="10">10 giây</option>
      </select>

      <button id="go" onclick="makeVideo()">✨ Tạo video AI</button>
      <div id="status"></div>
      <div id="result"></div>
    </div>

    <div class="card">
      <h2>🗣️ Giọng đọc tiếng Việt</h2>
      <label>Nội dung đọc</label>
      <textarea id="voiceText" rows="3" placeholder="Nhập lời thoại tiếng Việt..."></textarea>
      <button onclick="makeVoice()">🎙️ Tạo giọng đọc</button>
      <div id="voiceStatus"></div>
      <audio id="audio" controls style="width:100%; margin-top:10px; display:none;"></audio>
    </div>
  </main>

      current = m;
      document.getElementById("t1").classList.toggle("on", m === "image");
      document.getElementById("t2").classList.toggle("on", m === "text");
    }
