<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI Video Studio</title>
<style>
body{font-family:system-ui,sans-serif;margin:0;background:#f5f5f5;color:#222}
main{max-width:650px;margin:auto;padding:18px}
.card{background:white;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}
h1{font-size:25px;margin-top:4px} label{display:block;font-weight:700;margin:14px 0 6px}
textarea,input,select,button{width:100%;box-sizing:border-box;font-size:16px;border-radius:12px;padding:12px}
textarea,input,select{border:1px solid #ccc;background:#fff} button{border:0;background:#111;color:#fff;font-weight:700;margin-top:12px}
button:disabled{opacity:.5} .tabs{display:flex;gap:8px}.tabs button{background:#ddd;color:#222}.tabs .on{background:#111;color:#fff}
#status{white-space:pre-wrap}.video{width:100%;border-radius:14px;margin-top:12px}
small{color:#666}
</style>
</head>
<body>
<main>
<div class="card">
<h1>🎬 AI Video Studio</h1>
<small>Tạo video AI ngay trên điện thoại.</small>
<div class="tabs">
<button id="t1" class="on" onclick="mode('image')">🖼️ Ảnh → Video</button>
<button id="t2" onclick="mode('text')">✍️ Văn bản → Video</button>
</div>
<label>Ảnh (không bắt buộc ở chế độ văn bản)</label>
<input id="image" type="file" accept="image/*">
<label>Mô tả chuyển động / cảnh</label>
<textarea id="prompt" rows="5" placeholder="Ví dụ: Những đám mây trắng trôi chậm trên bầu trời, ánh sáng dịu, máy quay chuyển động nhẹ..."></textarea>
<label>Tỷ lệ</label>
<select id="ratio"><option value="720:1280">9:16 dọc</option><option value="1280:720">16:9 ngang</option><option value="960:960">1:1 vuông</option></select>
<label>Thời lượng</label>
<select id="duration"><option>5</option><option>10</option></select>
<button id="go" onclick="makeVideo()">✨ Tạo video AI</button>
<div id="status"></div>
<div id="result"></div>
</div>

<div class="card">
<h2>🗣️ Giọng đọc tiếng Việt</h2>
<label>Nội dung đọc</label>
<textarea id="voiceText" rows="5" placeholder="Nhập lời thoại tiếng Việt..."></textarea>
<button onclick="makeVoice()">🔊 Tạo giọng đọc</button>
<div id="voiceStatus"></div>
<audio id="audio" controls style="width:100%;margin-top:10px;display:none"></audio>
</div>
</main>
<script>
let current="image";
function mode(m){current=m; t1.classList.toggle("on",m==="image");t2.classList.toggle("on",m==="text");}
async function makeVideo(){
 const go=document.getElementById("go"), status=document.getElementById("status"), result=document.getElementById("result");
 go.disabled=true; status.textContent="Đang gửi yêu cầu cho AI..."; result.innerHTML="";
 const fd=new FormData(); fd.append("prompt",prompt.value); fd.append("ratio",ratio.value); fd.append("duration",duration.value);
 if(current==="image" && image.files[0]) fd.append("image",image.files[0]);
 try{
  const r=await fetch("/api/video",{method:"POST",body:fd}); const d=await r.json();
  if(!r.ok) throw new Error(d.error||"Lỗi");
  result.innerHTML=`<video class="video" controls playsinline src="${d.url}"></video><a href="${d.url}" target="_blank">Mở video AI</a>`;
  status.textContent="✅ Tạo xong!";
 }catch(e){status.textContent="❌ "+e.message}finally{go.disabled=false}
}
async function makeVoice(){
 const s=document.getElementById("voiceStatus"), a=document.getElementById("audio"); s.textContent="Đang tạo giọng đọc...";
 try{
  const r=await fetch("/api/tts",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text:voiceText.value})});
  if(!r.ok){const d=await r.json();throw new Error(d.error||"Lỗi")}
  const blob=await r.blob(); a.src=URL.createObjectURL(blob);a.style.display="block";a.play().catch(()=>{});
  s.textContent="✅ Đã tạo giọng đọc tiếng Việt.";
 }catch(e){s.textContent="❌ "+e.message}
}
</script>
</body>
</html>
